<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#333333; stroke-width:2; }
    .power { fill:#fdecea; stroke:#c0392b; stroke-width:2; }
    .logic { fill:#eaf2fd; stroke:#2166b0; stroke-width:2; }
    .actuator { fill:#eafaf1; stroke:#1e8449; stroke-width:2; }
    .label { font-size:14px; fill:#111111; }
    .title { font-size:16px; font-weight:bold; fill:#111111; }
    .small { font-size:11px; fill:#444444; }
    .arrow { stroke:#555555; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- 12V Supply -->
  <rect class="power" x="40" y="40" width="160" height="60" rx="6"/>
  <text class="title" x="120" y="65" text-anchor="middle">12V DC Supply</text>
  <text class="small" x="120" y="82" text-anchor="middle">Solenoid power</text>

  <!-- Buck converter -->
  <rect class="power" x="260" y="40" width="160" height="60" rx="6"/>
  <text class="title" x="340" y="65" text-anchor="middle">Buck Converter</text>
  <text class="small" x="340" y="82" text-anchor="middle">12V → 5V</text>

  <!-- ESP32 -->
  <rect class="logic" x="480" y="30" width="200" height="80" rx="6"/>
  <text class="title" x="580" y="60" text-anchor="middle">ESP32-WROOM-32</text>
  <text class="small" x="580" y="80" text-anchor="middle">WiFi + Firebase + Logic</text>

  <!-- 8ch relay -->
  <rect class="power" x="480" y="160" width="200" height="60" rx="6"/>
  <text class="title" x="580" y="185" text-anchor="middle">8-Channel Relay Module</text>
  <text class="small" x="580" y="202" text-anchor="middle">Opto-isolated, JD-VCC removed</text>

  <!-- Solenoids -->
  <rect class="actuator" x="480" y="260" width="200" height="70" rx="6"/>
  <text class="title" x="580" y="285" text-anchor="middle">6x 12V Solenoid Valves</text>
  <text class="small" x="580" y="302" text-anchor="middle">Tanks 1, 3, 4, 5 routing</text>
  <text class="small" x="580" y="317" text-anchor="middle">+ 1N4007 flyback diodes</text>

  <!-- Sensors -->
  <rect class="logic" x="740" y="20" width="220" height="120" rx="6"/>
  <text class="title" x="850" y="42" text-anchor="middle">Analog Sensors (3.3V, ADC1)</text>
  <text class="small" x="850" y="62" text-anchor="middle">Tank 1 Gas — GPIO34</text>
  <text class="small" x="850" y="78" text-anchor="middle">Tank 3 Gas — GPIO35</text>
  <text class="small" x="850" y="94" text-anchor="middle">Turbidity — GPIO32</text>
  <text class="small" x="850" y="110" text-anchor="middle">pH — GPIO33</text>

  <rect class="logic" x="740" y="160" width="220" height="100" rx="6"/>
  <text class="title" x="850" y="182" text-anchor="middle">Digital Sensors (3.3V)</text>
  <text class="small" x="850" y="202" text-anchor="middle">DS18B20 Temp — GPIO4</text>
  <text class="small" x="850" y="218" text-anchor="middle">Tank4 Float — GPIO18</text>
  <text class="small" x="850" y="234" text-anchor="middle">Tank5 Float — GPIO19</text>

  <!-- Tanks flow -->
  <rect class="box" x="40" y="400" width="140" height="60" rx="6"/>
  <text class="label" x="110" y="435" text-anchor="middle">Tank 1</text>
  <text class="small" x="110" y="450" text-anchor="middle">Collect + Gas Check</text>

  <rect class="box" x="230" y="400" width="140" height="60" rx="6"/>
  <text class="label" x="300" y="435" text-anchor="middle">Tank 2</text>
  <text class="small" x="300" y="450" text-anchor="middle">Passive Filter</text>

  <rect class="box" x="420" y="400" width="160" height="60" rx="6"/>
  <text class="label" x="500" y="435" text-anchor="middle">Tank 3</text>
  <text class="small" x="500" y="450" text-anchor="middle">Quality Analysis</text>

  <rect class="actuator" x="640" y="360" width="150" height="60" rx="6"/>
  <text class="label" x="715" y="395" text-anchor="middle">Tank 4 — Irrigation</text>

  <rect class="actuator" x="640" y="440" width="150" height="60" rx="6"/>
  <text class="label" x="715" y="475" text-anchor="middle">Tank 5 — Toilet Flush</text>

  <rect class="box" x="40" y="480" width="140" height="50" rx="6"/>
  <text class="label" x="110" y="510" text-anchor="middle">Drainage</text>

  <rect class="actuator" x="830" y="360" width="140" height="60" rx="6"/>
  <text class="label" x="900" y="395" text-anchor="middle">Garden</text>

  <rect class="actuator" x="830" y="440" width="140" height="60" rx="6"/>
  <text class="label" x="900" y="475" text-anchor="middle">Drainage</text>

  <!-- Flow arrows -->
  <path class="arrow" d="M180,430 L230,430"/>
  <path class="arrow" d="M370,430 L420,430"/>
  <path class="arrow" d="M110,400 L110,530" />
  <path class="arrow" d="M500,460 L500,530 L110,530" />
  <path class="arrow" d="M580,420 L640,390"/>
  <path class="arrow" d="M580,440 L640,465"/>
  <path class="arrow" d="M790,390 L830,390"/>
  <path class="arrow" d="M790,470 L830,470"/>

  <!-- Power/logic arrows -->
  <path class="arrow" d="M200,70 L260,70"/>
  <path class="arrow" d="M420,70 L480,70"/>
  <path class="arrow" d="M580,110 L580,160"/>
  <path class="arrow" d="M580,220 L580,260"/>
  <path class="arrow" d="M740,80 L680,70"/>
  <path class="arrow" d="M740,210 L680,90"/>

  <text class="small" x="120" y="540" text-anchor="end" transform="translate(0,0)"></text>
</svg>
